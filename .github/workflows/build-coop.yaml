name: Build coop

on:
    workflow_dispatch:
    push:
        branches: [ android-dev ]
    pull_request:
        branches: [ android-dev ]

jobs:
    build:
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[build]')) && github.event.pull_request.draft == false }}
        strategy:
          fail-fast: false
          matrix:
            platform:
              - name: Windows
                os: windows-latest
                make: make -j$(nproc)
                exe: .exe
                zip: dynos lang mods palettes coop.map discord_game_sdk.dll sm64coopdx.exe coopdx_updater.exe

              - name: Linux
                os: ubuntu-22.04
                deps: |
                  sudo apt update
                  sudo apt install -y build-essential git python3 libglew-dev libz-dev libcurl4-openssl-dev zip
                make: make -j$(nproc)
                zip: dynos lang mods palettes libdiscord_game_sdk.so sm64coopdx coopdx_updater

              - name: SteamOS
                os: ubuntu-22.04
                deps: |
                  sudo apt update
                  sudo apt install -y build-essential git python3 libglew-dev libz-dev libcurl4-openssl-dev zip
                make: make -j$(nproc)
                zip: dynos lang mods palettes libdiscord_game_sdk.so sm64coopdx coopdx_updater

              - name: macOS_ARM
                os: macos-15
                deps: brew install make mingw-w64 pkg-config glfw3 coreutils glew sdl3
                make: gmake OSX_BUILD=1 -j$(sysctl -n hw.ncpu)
                internal: .app/Contents/MacOS/sm64coopdx
                zip: sm64coopdx.app

              - name: macOS_Intel
                os: macos-15-intel
                deps: brew install make mingw-w64 pkg-config glfw3 coreutils glew sdl3
                make: gmake OSX_BUILD=1 -j$(sysctl -n hw.ncpu)
                internal: .app/Contents/MacOS/sm64coopdx
                zip: sm64coopdx.app

        name: ${{ matrix.platform.name }}
        runs-on: ${{ matrix.platform.os }}
        defaults:
            run:
                shell: ${{ case(matrix.platform.name == 'Windows', 'msys2 {0}', 'sh') }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                persist-credentials: false

            - name: Install MSYS2 (Windows)
              if: ${{ matrix.platform.name == 'Windows' }}
              uses: msys2/setup-msys2@v2
              with:
                msystem: ucrt64
                update: true
                install: >
                    unzip
                    make
                    git
                    mingw-w64-ucrt-x86_64-gcc
                    mingw-w64-ucrt-x86_64-glew
                    mingw-w64-ucrt-x86_64-sdl3
                    mingw-w64-ucrt-x86_64-python
                    mingw-w64-ucrt-x86_64-pkg-config
                    zip

            - name: Install dependencies
              if: ${{ matrix.platform.name != 'Windows' }}
              run: ${{ matrix.platform.deps }}

            - name: Build the game
              run: ${{ matrix.platform.make }} ${{ case(matrix.platform.name == 'SteamOS', 'HANDHELD=1', '') }}

            - name: Codesign Ad-Hoc (macOS)
              if: ${{ contains(matrix.platform.name, 'macOS') }}
              run: |
                codesign --force --deep --sign - ./build/us_pc/sm64coopdx.app

            - name: Generate hash
              run: |
                cd tools
                g++ -std=c++17 -o hash_file${{ matrix.platform.exe }} hash_file.cpp
                echo "::notice ::$(./hash_file${{ matrix.platform.exe }} ../build/us_pc/sm64coopdx${{ matrix.platform.exe }}${{ matrix.platform.internal }})"

            - name: Zip the game
              run: |
                cd ./build/us_pc
                zip -r sm64coopdx_${{ matrix.platform.name }}.zip ${{ matrix.platform.zip }}

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                path: ./build/us_pc/sm64coopdx_${{ matrix.platform.name }}.zip
                archive: false
    build-android:
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[build]')) && github.event.pull_request.draft == false }}
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '17'

            - name: Install dependencies
              run: |
                sudo apt update
                sudo apt install -y build-essential git python3 libglew-dev libz-dev libcurl4-openssl-dev g++ zip unzip wget apksigner
                mkdir -p $HOME/android-sdk/cmdline-tools
                cd $HOME/android-sdk/cmdline-tools
                wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
                unzip tools.zip
                rm tools.zip
                mv cmdline-tools latest
                export ANDROID_HOME=$HOME/android-sdk
                export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
                yes | sdkmanager --licenses
                sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
                echo "sdk.dir=$HOME/android-sdk" > $GITHUB_WORKSPACE/platform/local.properties

            - name: Build the game
              run: |
                make -j$(nproc) TOUCH_CONTROLS=1
                chmod +x ./platform/gradlew
                ./platform/gradlew assembleRelease
                apksigner sign \
                  --key platform/android/key.pk8 \
                  --cert platform/android/certificate.pem \
                  platform/app/build/outputs/apk/release/app-release-unsigned.apk
                mv platform/app/build/outputs/apk/release/app-release-unsigned.apk build/us_pc/sm64coopdx.apk

            - name: Generate hash
              run: |
                cd tools
                g++ -std=c++17 -o hash_file hash_file.cpp
                for f in ../platform/app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/*/libmain.so; do
                    abi=$(basename $(dirname "$f"))
                    hash=$(./hash_file "$f")
                    echo "::notice title=libmain.so ($abi)::$hash"
                done

            - name: Zip the .apk package
              run: |
                cd ./build/us_pc
                zip -r sm64coopdx_Android.zip sm64coopdx.apk
            
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: sm64coopdx-android
                path: ./build/us_pc/sm64coopdx_Android.zip
